# Pages CMS: einzige Redaktionsoberfläche für das Preview-Portfolio.
# Dieses Repository und main sind die Entwicklungsbasis. Das alte Repo bleibt Quelle für vorhandene Medien.
media:
  - name: uploads
    label: Portfolio-Medien
    input: assets/uploads
    output: /assets/uploads
    rename: safe
    categories: [image, document, video, audio]

content:
  - name: projects
    label: Projekte
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - name: slug
        label: Interne Projektkennung
        type: string
        required: true
        readonly: true
      - name: title
        label: Projekttitel
        type: string
        required: true
      - name: description
        label: Kurzbeschreibung
        type: text
        required: true
      - name: category
        label: Kategorie
        type: string
        required: true
      - name: label
        label: Bildetikett
        type: string
      - name: image
        label: Titelbild
        type: image
        required: true
      - name: alt
        label: Bildbeschreibung (Barrierefreiheit)
        type: string
        required: true
  - name: website
    label: Website und Dokumentation
    type: group
    items:
      - name: readme
        label: Projekt-Dokumentation
        type: file
        path: README.md
        format: code

settings:
  commit:
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} -> {newPath}"
